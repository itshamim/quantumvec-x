[package]
name = "qvx-core"
version = "2.0.0"
edition = "2021"
authors = ["Shamim FBL Strategy"]
description = "QuantumVec-X (QVX) — Universal Neural Compression Engine"

[lib]
name = "qvx_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Low-level & Performance
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3", "const_xxh3"] }
rayon = "1.8"
crossbeam = "0.8"
byteorder = "1.5"

# Compression & Math
bitvec = "1.0"
half = "2.3"
ndarray = "0.15"
zstd = "0.13"
lz4_flex = "0.11"

# AI & Inference
ort = { version = "1.16", features = ["load-dynamic"] } # ONNX Runtime
tokenizers = "0.13"

# Security & Crypto
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Python Bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py37"] }

[dev-dependencies]
tempfile = "3.8"
